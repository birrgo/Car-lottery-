<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>No Connection • BYD Lottery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-shell: rgba(255, 255, 255, 0.92);
            --bg-card: rgba(249, 250, 251, 0.9);
            --border: rgba(0, 0, 0, 0.1);
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --brand: #991b1b;
            --brand-hover: #7f1d1d;
            --radius-xl: 20px;
            --radius-md: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .hero-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('b.png') no-repeat center center/cover;
            z-index: -2;
        }
        .hero-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(3px);
            z-index: -1;
        }
        .app-shell {
            width: 100%;
            max-width: 460px;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-shell);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .error-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 32px 24px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .icon-box {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: #fef2f2;
            color: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }
        h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }
        p {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .btn-retry {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--brand);
            color: #ffffff;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(153, 27, 27, 0.25);
            transition: background 0.2s;
        }
        .btn-retry:hover { background: var(--brand-hover); }
    </style>
</head>
<body>
    <div class="hero-background"></div>
    <div class="hero-overlay"></div>

    <div class="app-shell">
        <div class="error-card">
            <div class="icon-box">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                    <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </div>
            <h1>Connection Lost</h1>
            <p>You are currently offline or your mobile connection is too slow. Please check your data or Wi-Fi and try again.</p>
            <button class="btn-retry" onclick="window.location.reload()">Retry Connection</button>
        </div>
    </div>

    <script>
        window.addEventListener('online', () => {
            window.location.href = './index.html';
        });
    </script>
</body>
</html>
